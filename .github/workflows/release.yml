# Build and publish a GitHub release when a version tag is pushed.
#
#   git tag v<version> && git push origin v<version>
#
# The tag must match __version__ in usage_monitor_for_claude/__init__.py
# (the build fails otherwise). Pushing a tag runs tests, builds the .deb
# and tar.gz, and publishes them as a release. A workflow_dispatch run
# builds and tests only - nothing is published.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-3.0 python3-requests python3-pil \
            fonts-dejavu-core fontconfig desktop-file-utils

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Build packages
        run: bash build.sh

      - name: Check tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(sed -n "s/^__version__ = '\([^']*\)'.*/\1/p" usage_monitor_for_claude/__init__.py)"
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "ERROR: tag $TAG does not match __version__ $VERSION" >&2
            exit 1
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DEB="dist/usage-monitor-for-claude_${VERSION}_all.deb"
          TAR="$(ls dist/usage-monitor-for-claude-${VERSION}*.tar.gz)"
          cat > /tmp/notes.md <<EOF
          Linux port of [Usage Monitor for Claude](https://github.com/jens-duttke/usage-monitor-for-claude) by Jens Duttke. Linux artifacts only - Windows users: use the [upstream releases](https://github.com/jens-duttke/usage-monitor-for-claude/releases).

          ## Install

          | System | Asset | Install |
          |---|---|---|
          | Debian / Ubuntu / Mint | \`$(basename "$DEB")\` | \`sudo apt install ./$(basename "$DEB")\` |
          | Any distro, no sudo | \`$(basename "$TAR")\` | extract, then \`./install.sh\` (installs into \`~/.local\`) |

          Then run \`usage-monitor-for-claude\` - a tray icon appears with your live usage (requires a logged-in [Claude Code](https://docs.anthropic.com/en/docs/claude-code)). All runtime dependencies come from system packages - no bundled interpreter, no pip.

          ## Full changelog

          See the \`[${VERSION}]\` entry in [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md).
          EOF
          gh release create "${GITHUB_REF_NAME}" "$DEB" "$TAR" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md
